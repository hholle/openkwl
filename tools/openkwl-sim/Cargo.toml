[package]
name = "openkwl-sim"
description = "Host simulator: runs openkwl-app (the firmware's application layer) against a thermal model of the unit, with HTTP API, web UI and SD-card storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
openkwl-app = { path = "../../crates/openkwl-app" }
openkwl-api = { path = "../../crates/openkwl-api" }
openkwl-auth = { path = "../../crates/openkwl-auth" }
openkwl-config = { path = "../../crates/openkwl-config" }
openkwl-core = { path = "../../crates/openkwl-core" }
openkwl-update = { path = "../../crates/openkwl-update" }
heapless = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }

[lints]
workspace = true
