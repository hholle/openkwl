# Exact versions on purpose: the firmware fills its flash slot to within a few KB, so a new
# compiler release can change whether it fits. Raise them deliberately (and check all three
# firmware variants against the budget, docs/DEVELOPMENT.md).
[tools]
rust = { version = "1.99.1", targets = "thumbv7m-none-eabi", components = "rustfmt,clippy,llvm-tools" }
node = "22.23.3"
pnpm = "10.34.6"
