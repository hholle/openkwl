[package]
name = "openkwl-app"
description = "Device application layer shared by the firmware and the host simulator: control loop, REST handlers, persistence decisions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
openkwl-api = { path = "../openkwl-api" }
openkwl-auth = { path = "../openkwl-auth" }
openkwl-bus = { path = "../openkwl-bus" }
openkwl-config = { path = "../openkwl-config" }
openkwl-core = { path = "../openkwl-core" }
openkwl-ha = { path = "../openkwl-ha" }
heapless = "0.8"
rand_core = { version = "0.6", default-features = false }
serde = { version = "1", default-features = false }
serde-json-core = "0.6"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
